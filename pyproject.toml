[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroaion"
version = "0.1.0"
description = "Full-auto, PRISMA 2020-compliant systematic review engine driven by a 10-agent Claude orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NeuroAIon" }]
dependencies = [
    "anthropic>=0.69.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "tenacity>=8.2",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
figures = ["matplotlib>=3.8"]   # alias: forest/funnel/PRISMA/risk-of-bias figures
oa = ["pypdf>=4.0"]            # optional Unpaywall -> OA PDF full-text extraction
pdf = ["reportlab>=4.0"]      # native PDF output without a LaTeX engine
dev = ["pytest>=8.0"]
all = ["matplotlib>=3.8", "reportlab>=4.0", "pypdf>=4.0"]

[project.scripts]
neuroaion = "neuroaion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
