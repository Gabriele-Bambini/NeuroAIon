# ─────────────────────────────────────────────────────────────────────────────
# NeuroAIon review protocol (PRISMA 2020, item 4–7).
#
# This file *seeds* the review. The ProtocolArchitect agent will refine any
# field left blank or marked `auto`, but anything you specify here is honoured
# verbatim — your protocol is the contract the whole pipeline is held to.
# ─────────────────────────────────────────────────────────────────────────────

title: >-
  Effects of transcranial direct current stimulation (tDCS) on working memory
  in healthy adults: a systematic review and meta-analysis

# The structured question. NeuroAIon is framework-agnostic — set `framework` to
# any of: PICO, PECO, PICOS, PECOS, PICOT, PICOTS, SPIDER, PCC, PIRD, CoCoPop,
# SPICE, ECLIPSE. For non-PICO frameworks, fill `elements` with the named slots.
pico:
  framework: "PICO"
  population: "Healthy adults (18–65 years), no diagnosed neurological or psychiatric disorder"
  intervention: "Anodal transcranial direct current stimulation (tDCS) over DLPFC"
  comparator: "Sham stimulation"
  outcome: "Working-memory performance (n-back accuracy / reaction time, digit span)"
  study_designs: ["randomized controlled trial", "randomized crossover trial"]
  # For non-PICO frameworks instead use, e.g.:
  # framework: "SPIDER"
  # elements: { Sample: "...", "Phenomenon of Interest": "...", Design: "...",
  #             Evaluation: "...", "Research type": "..." }

# Free-text question (optional; derived from PICO if omitted).
question: auto

# Eligibility criteria (PRISMA item 5). Add/remove freely.
inclusion_criteria:
  - "Peer-reviewed or preprint primary studies"
  - "Human participants"
  - "Reports at least one quantitative working-memory outcome"
  - "Sham-controlled comparison available"
exclusion_criteria:
  - "Animal or in-silico studies"
  - "Clinical populations (stroke, dementia, psychiatric diagnosis)"
  - "Reviews, editorials, conference abstracts without data"
  - "Non-DLPFC montage only"

# Search configuration (PRISMA item 6–7).
search:
  # All sources are free / open (no paid keys). Available:
  #   pubmed, europepmc, crossref, openalex, biorxiv, core,
  #   clinicaltrials, doaj, semanticscholar, arxiv
  # arxiv + semanticscholar are included by default so CS / methods preprints
  # (graph-ML, sheaf models, etc.) are covered. 'core' (290M+ OA works) needs a
  # free CORE_API_KEY env var for best results.
  sources: ["pubmed", "europepmc", "crossref", "openalex", "biorxiv",
            "arxiv", "semanticscholar", "core"]
  date_from: "2010-01-01"
  date_to: "auto"            # 'auto' = today
  languages: ["en"]
  # Per-source ceiling. With deep_pagination the connectors page to reach this
  # number (otherwise they return roughly the first page).
  max_records_per_source: 200
  # Seed keyword groups; SearchStrategist translates these into each database's
  # native syntax (PubMed [tiab]/MeSH+dates, Europe PMC TITLE/ABSTRACT,
  # Scopus TITLE-ABS-KEY, Web of Science TS=, arXiv abs:, …).
  keywords:
    - ["tDCS", "transcranial direct current stimulation", "anodal stimulation"]
    - ["working memory", "n-back", "digit span", "executive function"]
    - ["DLPFC", "dorsolateral prefrontal cortex"]

  # ── Recall amplifiers — the single biggest driver of review quality ──────────
  # Deep pagination: fetch beyond the first page, up to max_records_per_source
  # (OpenAlex/Crossref cursors, Europe PMC cursorMark, PubMed retstart, S2 offset).
  deep_pagination: true
  # Citation snowballing: chase each identified study's reference list (backward)
  # and the papers that cite it (forward) via OpenAlex/Crossref. PRISMA 2020
  # counts these as records identified "via other methods".
  snowball: true
  snowball_max: 200          # cap on records added by snowballing

  # ── Subscription databases (the legitimate way to use institutional access) ──
  # The engine never handles your university credentials. Instead: run the search
  # in your own authenticated browser on Scopus / Web of Science / Ovid / EBSCO /
  # ScienceDirect, EXPORT the results (RIS / BibTeX / NBIB / EndNote XML / CSV),
  # and list the downloaded files here. They are ingested into the normal pipeline
  # (de-duplicated against the API results, then screened) — standard PRISMA
  # practice, no terms of service violated.
  import_files: []
    # - "~/Desktop/exports/scopus_2024-06.ris"
    # - "~/Desktop/exports/web_of_science.bib"
    # - "~/Desktop/exports/ovid_medline.nbib"

  # ── Full-text PDFs (professional extraction) ─────────────────────────────────
  # Drop the report PDFs you obtained through your own legitimate access into a
  # folder and point here. Every PDF is parsed (reading-order text + IMRaD
  # sections + tables + reference list + auto-harvested statistics) and matched to
  # its record by DOI/title/filename, then used as the WORKING FULL TEXT for
  # screening, data extraction and risk of bias — so the appraisal reads the whole
  # report, not just the abstract. Open-access reports are fetched + extracted
  # automatically (Unpaywall/PMC/arXiv); this is for the ones behind a paywall
  # that you downloaded yourself. Needs:  pip install neuroaion[pdf-extract]
  # (optionally set GROBID_URL to use a GROBID server for ML-grade parsing).
  fulltext_dir: ""              # e.g. "~/Desktop/review_pdfs"

# Synthesis configuration (PRISMA item 13).
synthesis:
  effect_measure: "SMD"     # SMD | MD | OR | RR | HR
  model: "random"           # random (DerSimonian–Laird) | fixed
  min_studies_for_meta: 2
  publication_bias: true    # Egger's test + funnel plot (PRISMA item 14)

# Risk-of-bias appraisal (PRISMA item 11).
risk_of_bias:
  # RoB2 | ROBINS-I | ROBINS-E | Newcastle-Ottawa | QUADAS-2 | AMSTAR-2 | JBI
  tool: "RoB2"
  grade: true               # also produce a GRADE certainty rating

# Reporting.
reporting:
  authors_contact: "02gabrielebambini@gmail.com"
  registration: "Not registered (to be registered on PROSPERO)"
  prospero_export: true     # write a ready-to-submit PROSPERO registration form
  citation_style: "vancouver"   # vancouver | apa | harvard | numeric
